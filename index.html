<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI App Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--card:rgba(255,255,255,0.05);--card-border:rgba(255,255,255,0.08);--text:#f5f5f7;--text-secondary:rgba(255,255,255,0.6);--accent:#2997ff;--green:#30d158;--orange:#ff9f0a;--purple:#bf5af2;--pink:#ff375f;--cyan:#64d2ff}
@font-face{font-family:'SF';src:local('-apple-system'),local('BlinkMacSystemFont'),local('Segoe UI'),local('Helvetica Neue')}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;position:relative}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%,rgba(41,151,255,0.08) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(191,90,242,0.06) 0%,transparent 50%);pointer-events:none;z-index:0}

/* Language Toggle */
.lang-toggle{position:fixed;top:24px;right:32px;z-index:100;display:flex;background:rgba(255,255,255,0.08);border-radius:20px;padding:3px;backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1)}
.lang-btn{padding:6px 16px;border:none;background:none;color:var(--text-secondary);font-size:13px;cursor:pointer;border-radius:17px;transition:all .3s;font-weight:500}
.lang-btn.active{background:rgba(255,255,255,0.15);color:var(--text)}

/* Container */
.container{max-width:1080px;margin:0 auto;padding:40px 24px 16px;position:relative;z-index:1}

/* Hero */
.hero{text-align:center;margin-bottom:28px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;background:rgba(41,151,255,0.1);border:1px solid rgba(41,151,255,0.2);border-radius:20px;font-size:11px;color:var(--accent);margin-bottom:12px;letter-spacing:0.5px}
.hero-badge::before{content:'';width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero h1{font-size:clamp(28px,4vw,42px);font-weight:700;letter-spacing:-0.02em;background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,0.7) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1;margin-bottom:8px}
.hero p{font-size:clamp(14px,1.8vw,17px);color:var(--text-secondary);font-weight:400;max-width:500px;margin:0 auto}

/* Apps Grid */
.apps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.app-card{background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:20px 16px;text-align:center;transition:all .4s cubic-bezier(.25,.8,.25,1);position:relative;overflow:hidden}
.app-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent)}
.app-card:hover{transform:translateY(-4px);background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15);box-shadow:0 20px 40px rgba(0,0,0,0.3)}
.app-icon{width:52px;height:52px;border-radius:14px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:24px;position:relative}
.app-icon.trading{background:linear-gradient(135deg,#1a1a2e,#16213e);box-shadow:0 4px 16px rgba(41,151,255,0.2)}
.app-icon.finance{background:linear-gradient(135deg,#1a2e1a,#1e3a1e);box-shadow:0 4px 16px rgba(48,209,88,0.2)}
.app-icon.predict{background:linear-gradient(135deg,#2e1a2e,#3a1e3a);box-shadow:0 4px 16px rgba(191,90,242,0.2)}
.app-icon.crypto{background:linear-gradient(135deg,#2e2a1a,#3a351e);box-shadow:0 4px 16px rgba(255,159,10,0.2)}
.app-name{font-size:15px;font-weight:600;margin-bottom:3px;letter-spacing:-0.01em}
.app-status{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;margin-bottom:6px;font-weight:500}
.status-live{background:rgba(48,209,88,0.15);color:var(--green)}
.status-review{background:rgba(191,90,242,0.15);color:var(--purple)}
.status-dev{background:rgba(255,159,10,0.15);color:var(--orange)}
.status-concept{background:rgba(100,210,255,0.15);color:var(--cyan)}
.app-desc{font-size:12px;color:var(--text-secondary);line-height:1.4;margin-bottom:12px;min-height:34px}
.app-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 16px;border-radius:16px;font-size:12px;font-weight:500;text-decoration:none;transition:all .3s;border:none;cursor:pointer}
.btn-appstore{background:var(--accent);color:#fff}
.btn-appstore:hover{background:#1a8aff;transform:scale(1.05)}
.btn-coming{background:rgba(255,255,255,0.08);color:var(--text-secondary);cursor:default;border:1px solid rgba(255,255,255,0.1)}
.btn-appstore svg,.btn-coming svg{width:14px;height:14px}

/* DarwinFi Section */
.darwin-section{margin-top:4px;background:linear-gradient(135deg,rgba(41,151,255,0.05),rgba(191,90,242,0.05));border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:24px 24px 20px;position:relative;overflow:hidden}
.darwin-section::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(191,90,242,0.3),rgba(41,151,255,0.3),transparent)}
.darwin-section::after{content:'';position:absolute;bottom:-100px;right:-100px;width:300px;height:300px;background:radial-gradient(circle,rgba(191,90,242,0.06) 0%,transparent 70%);pointer-events:none}
.darwin-header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.darwin-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0a1628,#1a0a28);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 20px rgba(100,210,255,0.15);flex-shrink:0}
.darwin-title{font-size:20px;font-weight:700;letter-spacing:-0.02em}
.darwin-subtitle{font-size:13px;color:var(--text-secondary);margin-bottom:14px}
.darwin-modules{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.module{padding:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;transition:all .3s}
.module:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.12)}
.module-icon{font-size:18px;margin-bottom:6px}
.module-name{font-size:13px;font-weight:600;margin-bottom:3px}
.module-desc{font-size:11px;color:var(--text-secondary);line-height:1.4}
.darwin-philosophy{text-align:center;padding:12px 0 0;border-top:1px solid rgba(255,255,255,0.06);font-size:13px;color:var(--text-secondary);font-style:italic}
.darwin-philosophy strong{color:var(--text);font-style:normal}

/* Footer */
.footer{text-align:center;padding:16px 0 8px;color:rgba(255,255,255,0.3);font-size:11px}

/* Responsive */
@media(max-width:640px){
  .container{padding:50px 16px 24px}
  .hero{margin-bottom:36px}
  .apps-grid{grid-template-columns:1fr 1fr;gap:12px}
  .app-card{padding:20px 16px}
  .app-icon{width:52px;height:52px;border-radius:13px;font-size:24px}
  .darwin-section{padding:24px 18px}
  .darwin-modules{grid-template-columns:1fr 1fr;gap:8px}
  .module{padding:12px}
  .lang-toggle{top:16px;right:16px}
}
@media(max-width:380px){
  .apps-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- Language Toggle -->
<div class="lang-toggle">
  <button class="lang-btn active" onclick="setLang('zh')">中文</button>
  <button class="lang-btn" onclick="setLang('en')">EN</button>

<div class="container">

  <!-- Hero -->
  <section class="hero">

    <div class="app-card">

    <!-- Crypto Earn -->

  <!-- DarwinFi Vision -->

<script>
let currentLang = 'zh';

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.trim() === (lang === 'zh' ? '中文' : 'EN'));
  });
  document.querySelectorAll('[data-zh]').forEach(el => {
    const text = el.getAttribute('data-' + lang);
    if (text !== null) {
      if (text.includes('<strong>')) {
        el.innerHTML = text;
      } else {
        el.textContent = text;
      }
    }
  });
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
}

// Initialize
setLang('zh');
</script>
