<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI App Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;
  background:#000;color:#f5f5f7;min-height:100vh;overflow-x:hidden
}

/* Ambient glow */
.glow{position:fixed;pointer-events:none;z-index:0}
.glow-1{top:-20%;left:10%;width:600px;height:600px;background:radial-gradient(circle,rgba(0,113,227,0.12) 0%,transparent 70%)}
.glow-2{bottom:-10%;right:5%;width:500px;height:500px;background:radial-gradient(circle,rgba(94,92,230,0.1) 0%,transparent 70%)}

/* Language */
.lang-toggle{position:fixed;top:20px;right:28px;z-index:100;display:flex;background:rgba(255,255,255,0.06);border-radius:8px;padding:2px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.lang-btn{padding:5px 14px;border:none;background:none;color:rgba(255,255,255,0.4);font-size:12px;cursor:pointer;border-radius:6px;transition:all .25s;font-weight:500;letter-spacing:0.02em}
.lang-btn.active{background:rgba(255,255,255,0.12);color:#fff}

/* Layout */
.container{max-width:980px;margin:0 auto;padding:48px 40px 20px;position:relative;z-index:1}

/* Hero */
.hero{text-align:center;margin-bottom:40px}
.hero h1{font-size:48px;font-weight:700;letter-spacing:-0.03em;color:#fff;line-height:1.08;margin-bottom:8px}
.hero p{font-size:18px;color:rgba(255,255,255,0.5);font-weight:400;letter-spacing:-0.01em}

/* Apps */
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.app{background:rgba(255,255,255,0.04);border-radius:16px;padding:24px 20px 20px;text-align:center;transition:transform .35s,background .35s;cursor:default}
.app:hover{transform:translateY(-2px);background:rgba(255,255,255,0.07)}
.app-icon{width:64px;height:64px;border-radius:14px;margin:0 auto 14px;overflow:hidden;position:relative}
.app-icon img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.app-icon.placeholder{display:flex;align-items:center;justify-content:center}
.app-name{font-size:15px;font-weight:600;margin-bottom:4px;letter-spacing:-0.01em}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;margin-bottom:8px;font-weight:500;letter-spacing:0.02em}
.tag-live{background:rgba(52,199,89,0.15);color:#34c759}
.tag-review{background:rgba(94,92,230,0.15);color:#5e5ce6}
.tag-dev{background:rgba(255,159,10,0.15);color:#ff9f0a}
.app-desc{font-size:12px;color:rgba(255,255,255,0.45);line-height:1.5;margin-bottom:14px;min-height:36px}
.dl-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 18px;border-radius:980px;font-size:12px;font-weight:500;text-decoration:none;transition:all .25s;border:none;cursor:pointer;letter-spacing:0.01em}
.dl-btn-blue{background:#0071e3;color:#fff}
.dl-btn-blue:hover{background:#0077ed}
.dl-btn-gray{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);cursor:default}

/* DarwinFi */
.darwin{background:rgba(255,255,255,0.03);border-radius:16px;padding:24px 28px 20px;position:relative}
.darwin-top{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.darwin-logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#0a1a30,#1a0a2a);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden}
.darwin-logo::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,113,227,0.15),rgba(94,92,230,0.15));border-radius:12px}
.darwin-logo svg{position:relative;z-index:1}
.darwin h2{font-size:22px;font-weight:700;letter-spacing:-0.02em}
.darwin .tag{margin-left:8px;vertical-align:middle}
.tag-vision{background:rgba(0,199,190,0.15);color:#00c7be}
.darwin-sub{font-size:13px;color:rgba(255,255,255,0.45);margin-bottom:16px;letter-spacing:-0.01em}
.modules{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.mod{padding:14px;background:rgba(255,255,255,0.03);border-radius:10px;transition:background .3s}
.mod:hover{background:rgba(255,255,255,0.06)}
.mod-title{font-size:12px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.mod-title span{font-size:14px}
.mod-desc{font-size:11px;color:rgba(255,255,255,0.4);line-height:1.45}
.philosophy{text-align:center;padding:12px 0 0;border-top:1px solid rgba(255,255,255,0.06);font-size:12px;color:rgba(255,255,255,0.35)}
.philosophy b{color:rgba(255,255,255,0.7);font-weight:600}

/* Footer */
.footer{text-align:center;padding:20px 0 10px;font-size:11px;color:rgba(255,255,255,0.2)}

/* Responsive */
@media(max-width:768px){
  .container{padding:44px 20px 16px}
  .hero h1{font-size:32px}
  .hero p{font-size:15px}
  .apps{grid-template-columns:1fr 1fr;gap:12px}
  .modules{grid-template-columns:1fr 1fr;gap:8px}
  .darwin{padding:20px 18px 16px}
}
@media(max-width:480px){
  .apps{grid-template-columns:1fr}
  .modules{grid-template-columns:1fr}
}
</style>
</head>

<script>
let currentLang = 'zh';
function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.trim() === (lang === 'zh' ? '中文' : 'EN'));
  });
  document.querySelectorAll('[data-zh]').forEach(el => {
    const text = el.getAttribute('data-' + lang);
    if (text !== null) {
      if (text.includes('<b>') || text.includes('<strong>')) {
        el.innerHTML = text;
      } else {
        el.textContent = text;
      }
    }
  });
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
}
setLang('zh');
</script>
